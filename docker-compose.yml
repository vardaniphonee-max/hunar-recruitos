services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://recruitos:recruitos@db:5432/recruitos
      FRONTEND_URL: http://localhost:3000
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recruitos
      POSTGRES_USER: recruitos
      POSTGRES_PASSWORD: recruitos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitos"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - recruitos_data:/var/lib/postgresql/data

volumes:
  recruitos_data:
